    <tspan x="48" dy="0">
      A program that uses libpcap to capture
    </tspan>

    <tspan x="48" dy="23">
      TCP packets on a network interface in real time.
    </tspan>
  </text>

  <!-- 분야 태그 -->
  <rect
    x="570"
    y="118"
    width="118"
    height="32"
    rx="16"
    fill="#fff5b8"
  />

  <text
    x="629"
    y="139"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="13"
    font-weight="700"
