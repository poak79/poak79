<svg xmlns="http://www.w3.org/2000/svg"
     width="720"
     height="170"
     viewBox="0 0 720 170">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fffffb"/>
      <stop offset="100%" stop-color="#fffde8"/>
    </linearGradient>
  </defs>

  <!-- 카드 배경 -->
  <rect
    x="2"
    y="2"
    width="716"
    height="166"
    rx="22"
    fill="url(#background)"
    stroke="#f7e98f"
    stroke-width="3"
  />

  <!-- 왼쪽 강조선 -->
  <rect
    x="16"
    y="20"
    width="8"
    height="130"
    rx="4"
    fill="#f3d95c"
  />

  <!-- 프로젝트 번호 -->
  <rect
    x="42"
    y="23"
    width="63"
    height="38"
    rx="13"
    fill="#fff5b8"
  />

  <text
    x="73"
    y="49"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="18"
    font-weight="700"
    fill="#66561d">
    01
  </text>

  <!-- 프로젝트 제목 -->
  <text
    x="122"
    y="51"
    font-family="Arial, sans-serif"
    font-size="24"
    font-weight="700"
